name: Publish interface release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test position and history models
        run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test complete interface flows
        env:
          CHROMIUM_EXECUTABLE: bundled
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tracker-preview.log 2>&1 &
          tracker_server=$!
          trap 'kill "$tracker_server" || true' EXIT
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          node tests/browser-smoke.cjs
          node tests/enhancements-smoke.cjs
      - name: Package interface
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / 'interface.json').read_text())
          version = manifest['version']
          tag = f'v{version}'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag, 'Tag must match interface.json version'
          name = f"{manifest['id']}-{version}"
          out = root / 'release-assets'
          out.mkdir()
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          with zipfile.ZipFile(out / f'{name}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for filename in files:
                  archive.write(root / filename, f'{name}/{filename}')
          for screenshot in manifest.get('screenshots', []):
              source = root / screenshot['path']
              (out / f'{name}-{source.name}').write_bytes(source.read_bytes())
          assets = sorted(out.iterdir())
          (out / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(asset.read_bytes()).hexdigest()}  {asset.name}\n'
              for asset in assets
          ))
          with (pathlib.Path(os.environ['GITHUB_ENV'])).open('a') as env:
              env.write(f'RELEASE_TAG={tag}\n')
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Radio positions $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
