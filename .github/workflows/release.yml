name: Publish GPS plugin release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify backend and browser models
        run: |
          go test -race ./...
          npm test
          go build -o bin/gps-history .
          go build -o bin/mock-recorder ./cmd/mock-recorder
      - id: meta
        name: Validate version and plugin manifest
        run: |
          bin/gps-history --describe > plugin.manifest.json
          python3 - <<'PY'
          import json,os
          m=json.load(open('plugin.manifest.json'))
          assert m['api']==1 and m['id']=='gps-history'
          if os.environ['GITHUB_REF_TYPE']=='tag': assert os.environ['GITHUB_REF_NAME']=='v'+m['version']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('version='+m['version']+'\n')
          PY
      - name: Verify interface and real plugin flows
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.57.0
          tracker_browser=$(command -v google-chrome || command -v chromium)
          export CHROMIUM_EXECUTABLE="$tracker_browser"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/preview.log 2>&1 &
          tracker_server=$!
          trap 'kill "$tracker_server" || true' EXIT
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          node tests/browser-smoke.cjs
          node tests/enhancements-smoke.cjs
          node tests/plugin-browser.cjs
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04, goos: linux, goarch: arm64 }
          - { target: universal-apple-darwin, os: macos-latest, goos: darwin, goarch: arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Build native plugin
        if: matrix.goos != 'darwin'
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          go build -trimpath -ldflags='-s -w' -o "bin/gps-history$suffix" .
      - name: Build universal macOS plugin
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o bin/gps-history-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/gps-history-amd64 .
          lipo -create -output bin/gps-history bin/gps-history-arm64 bin/gps-history-amd64
      - name: Verify manifest and package
        shell: bash
        run: |
          go run . --describe > plugin.manifest.json
          suffix=''
          if [ '${{ matrix.goos }}' = windows ]; then suffix='.exe'; fi
          if [ '${{ matrix.target }}' != aarch64-unknown-linux-gnu ]; then
            "./bin/gps-history$suffix" --describe > built.manifest.json
            python3 -c 'import json; assert json.load(open("built.manifest.json"))==json.load(open("plugin.manifest.json"))'
          fi
          python3 scripts/third_party_notices.py
          python3 scripts/package_plugin.py --binary "bin/gps-history$suffix" --target '${{ matrix.target }}' --manifest plugin.manifest.json
          if [ '${{ matrix.target }}' = x86_64-unknown-linux-gnu ]; then
            cp plugin.manifest.json 'dist/gps-history-${{ needs.verify.outputs.version }}.manifest.json'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*
  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      - name: Check platform assets and checksums
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path('dist');m=json.loads(next(p.glob('*.manifest.json')).read_text())
          for t in ['x86_64-unknown-linux-gnu','aarch64-unknown-linux-gnu','universal-apple-darwin','x86_64-pc-windows-msvc']:
              ext='zip' if 'windows' in t else 'tar.gz'
              assert (p/f"gps-history-{m['version']}-{t}.{ext}").is_file()
          files=sorted(p.iterdir());(p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in files))
          PY
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish tested plugin release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "GPS history plugin $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
